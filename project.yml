name: VinFastCarPlayWidget
options:
  bundleIdPrefix: com.vinfast.carplay
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: "67"
    MARKETING_VERSION: "1.0.0"
    CODE_SIGN_STYLE: Automatic
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
targets:
  VinFastCarPlayWidget:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - VinFastCarPlayWidget.entitlements
      - path: Shared
        excludes:
          - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vinfast.carplay.widgethost
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/VinFastCarPlayWidget.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    entitlements:
      path: App/VinFastCarPlayWidget.entitlements
    dependencies:
      - target: LuxSAWidgetExtension
        embed: true
    scheme:
      testTargets: []

  LuxSAWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
          - LuxSAWidget.entitlements
      - path: Shared
        excludes:
          - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vinfast.carplay.widgethost.LuxSAWidget
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Widget/LuxSAWidget.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        SKIP_INSTALL: true
    entitlements:
      path: Widget/LuxSAWidget.entitlements
